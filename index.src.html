    r += '<rect x="'+x+'" y="'+y+'" width="'+(e-x)+'" height="1" fill="'+(pal&&pal[c]||'currentColor')+'"/>'; x=e; } });
  return '<svg class="px-i" width="'+w*sc+'" height="'+h*sc+'" viewBox="0 0 '+w+' '+h+'" shape-rendering="crispEdges" aria-hidden="true">'+r+'</svg>';
}

/* 내 사진은 IndexedDB에 (localStorage는 같은 주소의 다른 앱들과 5MB를 나눠 써서 쓰지 않음) */
const PKEY = 'triplog_gz_photos';
let PH = {};
const PDB = { db:null,
  open(){ return new Promise((ok,no)=>{ try{ const r = indexedDB.open('triplog_gz',1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos');
    r.onsuccess = () => { this.db = r.result; ok(this.db); }; r.onerror = () => no(r.error); }catch(e){ no(e); } }); },
  tx(mode){ return this.db.transaction('photos', mode).objectStore('photos'); },
  put(id,v){ return new Promise((ok,no)=>{ const r=this.tx('readwrite').put(v,id); r.onsuccess=()=>ok(); r.onerror=()=>no(r.error); }); },
  del(id){ return new Promise((ok,no)=>{ const r=this.tx('readwrite').delete(id); r.onsuccess=()=>ok(); r.onerror=()=>no(r.error); }); },
  all(){ return new Promise((ok,no)=>{ const out={}, r=this.tx('readonly').openCursor();
    r.onsuccess=()=>{ const c=r.result; if(c){ out[c.key]=c.value; c.continue(); } else ok(out); }; r.onerror=()=>no(r.error); }); }
};
async function loadPhotos(){
  try{
    await PDB.open();
    // 예전에 localStorage에 넣었던 사진은 옮기고 지움
    let old = null; try{ old = JSON.parse(localStorage.getItem(PKEY)); }catch(e){}
    if(old){ for(const k in old) await PDB.put(k, old[k]); try{ localStorage.removeItem(PKEY); }catch(e){} }
    PH = await PDB.all();
    if(Object.keys(PH).length) renderAll();
  }catch(e){ PDB.db = null; }
}

function shrinkPhoto(file, id){
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const max = 480, r = Math.min(1, max/Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    const data = c.toDataURL('image/jpeg', .72);
    const done = () => { renderAll(); if($('#sheet').classList.contains('on')) openPhoto(id); };
    if(!PDB.db){ toast('이 브라우저에선 사진을 저장할 수 없어요 (개인정보 보호 모드인지 확인)'); return; }
    PDB.put(id, data).then(()=>{ PH[id] = data; toast('사진을 넣었어요'); done(); })
      .catch(()=>{ toast('저장 공간이 꽉 찼어요. 안 쓰는 사진을 지워 주세요'); });
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('이 사진은 열 수 없어요. JPG나 PNG로 다시 골라 주세요'); };
  img.src = url;
}

function bboxVB(b){
  const a = prj([b[0],b[3]]), c = prj([b[2],b[1]]);
  let x=a[0], y=a[1], w=c[0]-a[0], h=c[1]-a[1];
  // 폰에서 너무 길쭉하지 않게 비율 맞춤
  if(h > w*1.05){ const nw = h/1.05; x -= (nw-w)/2; w = nw; }
  if(w > h*1.5){ const nh = w/1.5; y -= (nh-h)/2; h = nh; }
  return [x,y,w,h];
}
function mapVB(){
  if(mapZoom==='fit' && mapDay>=0){
    const pts = dayPts(mapDay);
    if(pts.length){
      let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
      pts.forEach(o=>{ x0=Math.min(x0,o.ll[0]); x1=Math.max(x1,o.ll[0]); y0=Math.min(y0,o.ll[1]); y1=Math.max(y1,o.ll[1]); });
      const pw = Math.max(.016, (x1-x0)*1.3+.010), ph = Math.max(.012, (y1-y0)*1.3+.006);
      const cx=(x0+x1)/2, cy=(y0+y1)/2;
      const v = bboxVB([cx-pw/2, cy-ph/2, cx+pw/2, cy+ph/2 + ph*.12]);
      return v;
    }
  }
  const z = ZOOMS[mapZoom];
  if(!z || !z.b) return [0,0,1000,MG.H];
  return bboxVB(z.b);
}

function minus(hm, mins){
  const m = /^(\d{1,2}):(\d{2})$/.exec(hm||''); if(!m) return '';
  let t = (+m[1])*60 + (+m[2]) - mins; t = ((t%1440)+1440)%1440;
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}

  const warn = dt && d.items.some(x=>{ const p=x.placeId&&place(x.placeId); return p && p.closed && p.closed.includes(dt.getDay()); });
  if(areas.length || warn){
    h += '<div class="areas">'+areas.map(a=>'<span class="pill ac">'+AREAS[a].short+'</span>').join('')
      + (warn?'<span class="pill warn">'+DOW[dt.getDay()]+'요일 휴무 많은 곳 있음</span>':'')+'</div>';
  }
  // 항공 배너
  const f = S.flights;
  if(i===0 && f.out.arr) h += '<div class="banner">광저우 도착 <b>'+esc(f.out.arr)+'</b> · 입국 수속 후 호텔까지 1시간 정도</div>';
  if(i===S.days.length-1 && f.back.dep) h += '<div class="banner">출국 <b>'+esc(f.back.dep)+'</b> · 호텔에서 <b>'+minus(f.back.dep,240)+'</b>까지 출발 (공항 1시간 + 3시간 전 도착)</div>';

  if(!d.items.length){
    h += '<div class="tl"><div class="empty-day">아직 일정이 없어요<br>아래에서 장소를 넣어 보세요</div></div>';
  } else {
    h += '<div class="tl">';
    d.items.forEach((x,k)=>{
      if(k>0){
        const auto = moveText(d.items[k-1].placeId, x.placeId);
        const txt = x.move || auto;
        if(txt) h += '<div class="mv'+(x.move?' custom':'')+'">'+ICON_WALK+esc(txt)+'</div>';
      }
      const p = x.placeId && place(x.placeId);
      const zh = itemZh(x);
      const metas = [];
      if(p && p.mich) metas.push('<span class="ac">미슐랭 '+p.mich+'</span>');
      if(p && p.price && !(p.price[0]===0&&p.price[1]===0)) metas.push('<span>1인 ¥'+p.price[0]+(p.price[0]!==p.price[1]?'~'+p.price[1]:'')+'</span>');
      if(p && p.closed && dt && p.closed.includes(dt.getDay())) metas.push('<span class="warn">'+DOW[dt.getDay()]+'요일 휴무 많음</span>');
      h += '<button class="it" onclick="openItem('+k+')"><div class="t'+(x.time?'':' none')+'">'+(esc(x.time)||'--:--')+'</div><div style="min-width:0">'
        + '<div class="ti">'+esc(itemName(x))+'</div>'
        + (zh && zh!==itemName(x) ? '<div class="zhl zh">'+esc(zh)+'</div>'+pyLine(zh, x.zh?null:p) : '')
        + (x.memo ? '<div class="memo">'+esc(x.memo)+'</div>' : '')
        + (metas.length ? '<div class="meta">'+metas.join('')+'</div>' : '')
        + '</div>'+(p ? thumb(p,50) : '<span></span>')+'</button>';
    });
    h += '</div>';
  }
  h += '<div class="btns"><button class="btn ac" onclick="openPicker()">장소에서 추가</button><button class="btn" onclick="openItem(-1)">직접 추가</button></div>';
  h += '<div class="btns"><button class="btn sm" onclick="openMapDay()">지도에서 동선 보기</button><button class="btn sm" onclick="sortDay()">시간순 정렬</button>'
    + (S.days.length>1?'<button class="btn sm danger" onclick="delDay()">이 날 삭제</button>':'')+'</div>';
  $('#dayView').innerHTML = h;
}
function pickDay(i){ S.day=i; save(); renderDays(); }
function addDay(){ S.days.push({id:uid(),items:[]}); S.day=S.days.length-1; save(); renderAll(); }
function delDay(){
  const d=S.days[S.day];
  const run = () => { S.days.splice(S.day,1); S.day=Math.max(0,S.day-1); save(); renderAll(); };
  if(!d.items.length) return run();
  ask((S.day+1)+'일차 일정 '+d.items.length+'개를 지울까요?', '지우기', run);
}
function sortDay(){
  const d=S.days[S.day];
  d.items.sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  save(); renderDays(); toast('시간순으로 정렬했어요');
}

/* ───────── 시트 ───────── */
function openSheet(title, html){ sheetPlace = null; $('#shTitle').textContent=title; $('#shBody').innerHTML=html; $('#dim').classList.add('on'); $('#sheet').classList.add('on'); $('#shBody').scrollTop=0; }
function closeSheet(){ sheetPlace = null; $('#dim').classList.remove('on'); $('#sheet').classList.remove('on'); }

function openFlight(k){
  const x = S.flights[k];
  openSheet(k==='out'?'가는 편':'오는 편',
    '<div class="fld"><label>편명</label><input id="fNo" value="'+esc(x.no)+'" placeholder="예: KE865" autocapitalize="characters"></div>'
   +'<div class="fld"><label>날짜</label><input id="fDate" type="date" value="'+esc(x.date)+'">'
   +(k==='out'?'<div class="hint">가는 날 날짜로 1일차부터 날짜가 매겨져요</div>':'')+'</div>'
   +'<div class="two"><div class="fld"><label>출발 (현지 시간)</label><input id="fDep" type="time" value="'+esc(x.dep)+'"></div>'
   +'<div class="fld"><label>도착 (현지 시간)</label><input id="fArr" type="time" value="'+esc(x.arr)+'"></div></div>'
   +'<div class="btns" style="margin:4px 0 0"><button class="btn ac" onclick="saveFlight(\''+k+'\')">저장</button></div>');
}
function saveFlight(k){
  S.flights[k] = {no:$('#fNo').value.trim(), date:$('#fDate').value, dep:$('#fDep').value, arr:$('#fArr').value};
  // 오는 편 날짜가 있으면 일수 맞추기 제안
  if(S.flights.out.date && S.flights.back.date){
    const n = Math.round((new Date(S.flights.back.date)-new Date(S.flights.out.date))/864e5)+1;
    if(n>0 && n<15 && n!==S.days.length){
      if(n>S.days.length){ while(S.days.length<n) S.days.push({id:uid(),items:[]}); toast(n+'일 일정으로 늘렸어요'); }
      else toast('항공 날짜는 '+n+'일인데 일정은 '+S.days.length+'일이에요');
    }
  }
  save(); closeSheet(); renderAll();
}

function openItem(k){
  const d = S.days[S.day];
  const x = k>=0 ? d.items[k] : {time:'',placeId:null,title:'',zh:'',memo:'',move:''};
  const p = x.placeId && place(x.placeId);
  const auto = k>0 ? moveText(d.items[k-1].placeId, x.placeId) : '';
  let h = '';
  if(p) h += '<div class="card" style="margin-bottom:12px"><div style="font-weight:700">'+esc(p.ko)+'</div><div class="zh" style="color:var(--t2);font-size:14px">'+esc(p.zh)+'</div>'+pyLine(p.zh,p)+links(p)
    + '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn sm" style="background:var(--bg)" onclick="copy(\''+jsq(p.gaode||p.zh)+'\')">고덕 검색어 복사</button>'
    + '<button class="btn sm" style="background:var(--bg)" onclick="closeSheet();showPlace(\''+p.id+'\')">장소 정보</button></div></div>';
  h += '<div class="fld"><label>시간</label><input id="iTime" type="time" value="'+esc(x.time)+'"></div>';
  h += '<div class="fld"><label>이름'+(p?' (비우면 장소 이름)':'')+'</label><input id="iTitle" value="'+esc(x.title)+'" placeholder="'+(p?esc(p.ko):'예: 호텔 휴식')+'"></div>';
  if(!p) h += '<div class="fld"><label>중국어 (고덕 검색용, 선택)</label><input id="iZh" class="zh" value="'+esc(x.zh)+'"></div>';
  h += '<div class="fld"><label>메모</label><textarea id="iMemo">'+esc(x.memo)+'</textarea></div>';
  if(k!==0) h += '<div class="fld"><label>앞 장소에서 이동</label><input id="iMove" value="'+esc(x.move)+'" placeholder="'+esc(auto||'예: 택시 15분')+'"><div class="hint">비우면 자동 안내'+(auto?' ('+esc(auto)+')':'')+'</div></div>';
  h += '<div class="btns" style="margin:4px 0 0"><button class="btn ac" onclick="saveItem('+k+')">저장</button></div>';
  if(k>=0){
    h += '<div class="btns" style="margin:10px 0 0">'
      + '<button class="btn" '+(k===0?'disabled style="opacity:.35"':'')+' onclick="moveItem('+k+',-1)">위로</button>'
      + '<button class="btn" '+(k===d.items.length-1?'disabled style="opacity:.35"':'')+' onclick="moveItem('+k+',1)">아래로</button></div>';
    if(S.days.length>1) h += '<div class="fld" style="margin-top:14px"><label>다른 날로 옮기기</label><div class="daypick">'
      + S.days.map((_,j)=>j===S.day?'':'<button onclick="toDay('+k+','+j+')">'+(j+1)+'일차</button>').join('')+'</div></div>';
    h += '<div class="btns" style="margin:14px 0 0"><button class="btn danger" onclick="delItem('+k+')">이 일정 삭제</button></div>';
  }
  openSheet(k>=0?'일정 수정':'직접 추가', h);
}
function saveItem(k){
  const d = S.days[S.day];
  const x = k>=0 ? d.items[k] : {id:uid(),placeId:null};
  x.time = $('#iTime').value;
  x.title = $('#iTitle').value.trim();
  if($('#iZh')) x.zh = $('#iZh').value.trim();
  x.memo = $('#iMemo').value.trim();
  x.move = $('#iMove') ? $('#iMove').value.trim() : (x.move||'');
  if(k<0){
    if(!x.title){ toast('이름을 적어 주세요'); return; }
    d.items.push(x);
  }
  save(); closeSheet(); renderAll();
}
function moveItem(k,dir){
  const a = S.days[S.day].items, j = k+dir;
  if(j<0||j>=a.length) return;
  [a[k],a[j]]=[a[j],a[k]]; save(); renderDays(); openItem(j);
}
function toDay(k,j){
  const x = S.days[S.day].items.splice(k,1)[0];
  x.move = '';
  S.days[j].items.push(x); save(); closeSheet(); renderAll(); toast((j+1)+'일차로 옮겼어요');
}
function delItem(k){
  const x = S.days[S.day].items[k];
  ask('「'+itemName(x)+'」 일정을 지울까요?', '지우기', () => { S.days[S.day].items.splice(k,1); save(); renderAll(); });
}

/* 장소에서 추가 (일정 탭) */
let pickCat='all';
function openPicker(){
  openSheet((S.day+1)+'일차에 장소 넣기',
    '<div class="search" style="margin:0 0 10px"><input id="pq" placeholder="검색" oninput="renderPick()" autocomplete="off"></div>'

}
function renderPick(){
  const q = ($('#pq')?.value||'').trim().toLowerCase();

}
function addToDay(id, j, fromPicker){

/* ───────── 장소 탭 ───────── */
let cat='all', area='all';
function placeCard(p){
  const u = usedIn(p.id);
  const badges = [];
  if(p.mich) badges.push('<span class="bd mich">미슐랭 '+p.mich+'</span>');
  (p.tags||[]).forEach(t=>badges.push('<span class="bd ac">'+(t==='영상'?'유튜브 영상':t)+'</span>'));
  badges.push('<span class="bd cat" style="--c:'+CAT_C[p.cat]+(p.cat==='base'?';color:#FFF6B8':'')+'">'+CATS[p.cat]+'</span>');
  badges.push('<span class="bd">'+AREAS[p.area].short+'</span>');
  if(p.closed) badges.push('<span class="bd warn">'+p.closed.map(d=>DOW[d]).join('·')+'요일 휴무 많음</span>');
  if(u.length) badges.push('<span class="bd ac">'+u.join('·')+'일차에 넣음</span>');
  const pr = priceText(p);
  const fav = S.fav[p.id];
  return '<div class="pc" id="pc-'+p.id+'"><div class="h"><div style="min-width:0;flex:1"><div class="nmrow"><span class="nm">'+esc(p.ko)+'</span>'
    + '<button class="star'+(fav?' on':'')+'" onclick="toggleFav(\''+p.id+'\')" aria-label="찜">'+ICON_STAR(fav)+'</button></div>'
    + '<div class="zhn zh">'+esc(p.zh)+'</div>'+pyLine(p.zh,p)+'</div>'
    + '<button class="thbtn" onclick="openPhoto(\''+p.id+'\')" aria-label="'+esc(p.ko)+' 사진 보기">'+thumb(p,76)+'</button></div>'
    + '<div class="badges">'+badges.join('')+'</div>'
    + (pr?'<div class="price">'+pr+'</div>':'')
    + (p.addr?'<div class="note zh">'+esc(p.addr)+'</div>'+pyLine(p.addr):'')
    + (p.note?'<div class="note">'+esc(p.note)+'</div>':'')
    + (p.menu&&p.menu.length?'<div class="menu">'+p.menu.map(m=>'<button onclick="copy(\''+jsq(m[0])+'\')"><div><div class="zh">'+esc(m[0])+'</div>'+pyLine(m[0],m[2]?{py:m[2]}:null)+(m[1]?'<div class="ko">'+esc(m[1])+'</div>':'')+'</div><span class="cp">복사</span></button>').join('')+'</div>':'')
    + links(p)
    + '<div class="acts"><button onclick="copy(\''+jsq(p.gaode||p.zh)+'\')">고덕 검색어 복사</button><button class="ac" onclick="openAddTo(\''+p.id+'\')">일정에 넣기</button>'
    + (p.custom?'<button onclick="openPlaceEdit(\''+p.id+'\')">수정</button>':'')+'</div></div>';
}
function jsq(s){ return esc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }
function renderPlaces(){
  const counts = {};
  allPlaces().forEach(p=>counts[p.cat]=(counts[p.cat]||0)+1);
  $('#catChips').innerHTML = ['all','fav',...Object.keys(CATS).filter(c=>c!=='base')].map(c=>{
    const lb = c==='all'?'전체':c==='fav'?'찜':CATS[c];
    return '<button class="chip'+(cat===c?' on':'')+'" onclick="cat=\''+c+'\';renderPlaces()">'+lb+'</button>';
  }).join('');
  $('#areaChips').innerHTML = ['all','tianhe','dongshan','zhujiang','liwan','any','etc'].map(a=>'<button class="chip'+(area===a?' on':'')+'" onclick="area=\''+a+'\';renderPlaces()">'+(a==='all'?'모든 지역':AREAS[a].short)+'</button>').join('');
  const q = $('#q').value.trim().toLowerCase();
  const list = allPlaces().filter(p=>{
    if(cat==='fav' ? !S.fav[p.id] : (cat!=='all' && p.cat!==cat)) return false;
    if(cat==='all' && p.cat==='base') return false;
    if(area!=='all' && p.area!==area) return false;
    if(q){
      const hay = (p.ko+' '+p.zh+' '+(p.note||'')+' '+(p.menu||[]).map(m=>m.join(' ')).join(' ')+' '+(p.mich?'미슐랭':'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  $('#placeCnt').textContent = list.length+'곳 · 가격은 1인 기준 대략, 1위안 = '+(+S.rate||190)+'원';
  $('#placeList').innerHTML = list.map(placeCard).join('') || '<div class="empty-day">해당하는 장소가 없어요</div>';
}
function toggleFav(id){ S.fav[id]=!S.fav[id]; if(!S.fav[id]) delete S.fav[id]; save(); renderPlaces(); renderRec(); renderMap();
  if(sheetPlace===id && $('#sheet').classList.contains('on')) $('#shBody').innerHTML = placeCard(place(id)); }
function openAddTo(id){
  const p = place(id);
  openSheet(p.ko+' 넣을 날', '<div class="daypick">'+S.days.map((d,j)=>{
    const dt = dayDate(j);
    return '<button onclick="addToDay(\''+id+'\','+j+')">'+(j+1)+'일차<span>'+(dt?fmtDate(dt):d.items.length+'개 일정')+'</span></button>';
  }).join('')+'</div>');
}
function showPlace(id){
  go('place'); cat='all'; area='all'; $('#q').value=''; renderPlaces();
  const el = document.getElementById('pc-'+id);
  if(el){ el.scrollIntoView({block:'center'}); el.style.boxShadow='0 0 0 2px var(--accent)'; setTimeout(()=>el.style.boxShadow='',1500); }
}
function openPlaceEdit(id){

  const opt = (o,v) => Object.keys(o).filter(k=>k!=='base'&&k!=='airport').map(k=>'<option value="'+k+'"'+(k===v?' selected':'')+'>'+(o[k].ko||o[k])+'</option>').join('');

   +'<div class="fld"><label>메모</label><textarea id="eNote">'+esc(p.note)+'</textarea></div>'
   +'<div class="btns" style="margin:4px 0 0"><button class="btn ac" onclick="savePlace('+(id?'\''+id+'\'':'')+')">저장</button></div>'
   +(id?'<div class="btns" style="margin:10px 0 0"><button class="btn danger" onclick="delPlace(\''+id+'\')">장소 삭제</button></div>':''));
}
function savePlace(id){
  const ko=$('#eKo').value.trim(); if(!ko){ toast('이름을 적어 주세요'); return; }
  const p1=parseInt($('#eP1').value,10), p2=parseInt($('#eP2').value,10);
  const data = {ko, zh:$('#eZh').value.trim()||ko, py:$('#ePy').value.trim(), cat:$('#eCat').value, area:$('#eArea').value, note:$('#eNote').value.trim(),
    price: isNaN(p1)&&isNaN(p2) ? null : [isNaN(p1)?p2:p1, isNaN(p2)?p1:p2],
    menu: $('#eMenu').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const [a,b,c]=l.split('/'); return [a.trim(), (b||'').trim(), (c||'').trim()]; }),
    tags:[], custom:true};
  if(id){ Object.assign(S.custom.find(x=>x.id===id), data); }
  else { data.id='c'+uid(); S.custom.push(data); }
  save(); closeSheet(); renderAll(); toast('저장했어요');
}
function delPlace(id){
  const u = usedIn(id);
  ask(u.length?u.join('·')+'일차 일정에서도 빠져요. 지울까요?':'이 장소를 지울까요?', '지우기', () => {
    S.custom = S.custom.filter(x=>x.id!==id);
    S.days.forEach(d=>d.items=d.items.filter(x=>x.placeId!==id));
    save(); renderAll();
  });
}

/* ───────── 추천 탭 ───────── */
function renderRec(){
  $('#courses').innerHTML = COURSES.map((c,ci)=>{
    const ps = c.ids.map(place).filter(Boolean);
    const total = ps.filter(p=>p.price).reduce((s,p)=>[s[0]+p.price[0],s[1]+p.price[1]],[0,0]);
    return '<div class="course"><h3>'+esc(c.t)+'</h3><div class="why">'+esc(c.why)+'</div><ol>'
      + ps.map((p,i)=>{
          const mv = i>0 ? moveText(ps[i-1].id,p.id) : '';
          return '<li><span class="n">'+(i+1)+'</span><div><span>'+esc(p.ko)+'</span> <span class="s zh">'+esc(p.zh)+'</span>'+(pyOf(p.zh,p)?' <span class="s">'+esc(pyOf(p.zh,p))+'</span>':'')
            +(mv&&mv!=='같은 동네 · 걸어서'?'<div class="s">'+esc(mv)+'</div>':'')+'</div></li>';
        }).join('')+'</ol>'
      + '<div class="meta">'+(total[1]>0?'<span class="pill">먹는 데 1인 약 ¥'+total[0]+'~'+total[1]+'</span>':'')
      + (c.warn?'<span class="pill warn">'+esc(c.warn)+'</span>':'')+'</div>'
      + '<div class="btns" style="margin:12px 0 0"><button class="btn soft" onclick="openCourseTo('+ci+')">이 코스를 일정에 넣기</button></div></div>';
  }).join('');
  const not = allPlaces().filter(p=>((p.tags||[]).length || p.mich || S.fav[p.id]) && p.cat!=='base' && !usedIn(p.id).length);
  $('#notUsed').innerHTML = not.map(placeCard).join('') || '<div class="empty-day">추천 장소를 다 넣었어요</div>';
}
function openCourseTo(ci){
  const c = COURSES[ci];
  openSheet(c.t+' 넣을 날', '<div class="daypick">'+S.days.map((d,j)=>{
    const dt = dayDate(j);
    return '<button onclick="addCourse('+ci+','+j+')">'+(j+1)+'일차<span>'+(dt?fmtDate(dt):d.items.length+'개 일정')+'</span></button>';
  }).join('')+'</div><div class="hint" style="font-size:12.5px;color:var(--t2);margin-top:12px">이미 그 날에 있는 장소는 빼고 뒤에 붙여요</div>');
}
function addCourse(ci,j){
  const d = S.days[j]; let n=0;
  COURSES[ci].ids.forEach(id=>{ if(!d.items.some(x=>x.placeId===id)){ d.items.push({id:uid(),time:'',placeId:id,title:'',zh:'',memo:'',move:''}); n++; } });
  S.day=j; save(); closeSheet(); renderAll(); toast((j+1)+'일차에 '+n+'곳 넣었어요');
}

    +'<p style="margin-top:12px;font-size:13px;color:var(--t2)">택시 기사님께는 이 화면의 중국어를 그대로 보여 주면 돼요</p></div></div>'

    +'<li>장소 탭의 「고덕 검색어 복사」를 눌러 붙여넣기</li>'
    +'<li>체인(喜茶·霸王茶姬·袁记云饺)은 지도를 正佳广场으로 옮긴 뒤 이름만 검색 → 거리순 맨 위가 가장 가까운 지점</li>'
    +'<li>웹 링크는 앱으로 안 넘어가요. 복사·붙여넣기가 제일 확실해요</li></ol></div></div>'

    +'<div class="sec">미슐랭 예약</div><div class="pad"><div class="card info"><p>4명이면 <b>1~2주 전</b> 예약. 메리어트 <b>컨시어지에 이메일</b>로 부탁하는 게 제일 쉬워요.</p>'
    +'<p>炳胜公馆은 예약할 때 <span class="zh">脆皮荔枝鸡</span>(하루 15마리 한정)를 같이 요청하세요.</p></div></div>'

    +'<div class="sec">이동·결제</div><div class="pad"><div class="card info">'
    +'<p>4명이면 지하철보다 <b>택시·디디</b>가 편하고 비용도 비슷해요. 디디는 알리페이 안에서 부를 수 있어요.</p>'
    +'<p>지하철 <b>1호선</b> 하나로 体育中心(호텔) → 东山口 → 陈家祠 → 长寿路 → 黄沙(沙面)까지 이어져요.</p>'
    +'<p>결제는 알리페이·위챗페이에 한국 카드를 연결해 두세요.</p></div></div>'

    +'<div class="sec">환율</div><div class="pad"><div class="card"><div class="rate">1위안 = <input id="rate" inputmode="numeric" value="'+(+S.rate||190)+'" onchange="S.rate=+this.value||190;save();renderAll()"> 원 <span style="color:var(--t2);font-size:13px">원화 표시에 써요</span></div></div></div>'

function exportData(){
  openSheet('백업 복사',
    '<p class="askmsg">아래 글자를 통째로 복사해서 메모 앱에 붙여 두세요. 나중에 「백업 붙여넣기」로 되살릴 수 있어요.</p>'
    +'<div class="fld"><textarea id="bkOut" class="json" readonly>'+esc(JSON.stringify(S))+'</textarea></div>'
    +'<div class="btns" style="margin:4px 0 0"><button class="btn ac" onclick="copyBackup()">전체 복사</button></div>');
}
function copyBackup(){
  const ta = $('#bkOut'); const text = ta.value;
  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast('백업을 복사했어요')).catch(sel); } else sel();
  function sel(){ ta.focus(); ta.select(); try{ document.execCommand('copy'); toast('백업을 복사했어요'); }catch(e){ toast('글자를 길게 눌러 전체 선택 후 복사하세요'); } }
}
function openImport(){
  openSheet('백업 붙여넣기',
    '<p class="askmsg">「백업 복사」로 저장해 둔 글자를 붙여넣으세요. 지금 일정은 이걸로 바뀌어요.</p>'
    +'<div class="fld"><textarea id="bkIn" class="json" placeholder="여기에 붙여넣기"></textarea></div>'
    +'<div class="btns" style="margin:4px 0 0"><button class="btn ac" onclick="importData()">이걸로 바꾸기</button></div>');
}
function importData(){
  let d; try{ d = JSON.parse($('#bkIn').value); }catch(e){}
  if(!d || !d.days || !d.flights){ toast('백업 글자가 아니에요. 처음부터 끝까지 다 붙여넣었는지 확인하세요'); return; }
  S = d; save(); closeSheet(); renderAll(); toast('불러왔어요');
}
function resetData(){
  ask('항공편·일정·직접 추가한 장소가 모두 처음 상태로 돌아가요.', '되돌리기', () => { S = seed(); save(); renderAll(); toast('처음 일정으로 되돌렸어요'); });
}
/* 확인창 (링크 화면에서는 브라우저 확인창이 안 떠서 직접 만듦) */
function ask(msg, yes, fn){
  openSheet('확인', '<p class="askmsg">'+esc(msg)+'</p><div class="btns" style="margin:12px 0 0"><button class="btn" onclick="closeSheet()">취소</button><button class="btn danger-fill" id="askYes">'+esc(yes)+'</button></div>');
  $('#askYes').onclick = () => { closeSheet(); fn(); };
}

const TABS = [['plan','일정'],['place','장소'],['map','지도'],['rec','추천'],['info','정보']];
$('#tabs').innerHTML = TABS.map((t,i)=>'<button class="'+(i?'':'on')+'" data-pg="'+t[0]+'">'+pix(PXI[t[0]],null,2.5)+t[1]+'</button>').join('');
$('#mascot').innerHTML = pix(MASCOT,{K:'#0B0A05',W:'#FFFCF7',P:'#F7C6D9'},4);
function go(pg){
  document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on', e.id==='pg-'+pg));
  if(pg==='map') renderMap();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.pg===pg));
  window.scrollTo(0,0);
}
$('#tabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) go(b.dataset.pg); });
$('#q').addEventListener('input', renderPlaces);

function renderAll(){ renderTop(); renderFlights(); renderDays(); renderPlaces(); renderRec(); renderInfo(); renderMap(); }
renderAll();
loadPhotos();
