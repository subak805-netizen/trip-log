  const base = (MALL_SPOTS[p.id]||{}).list||[], mine = ((S.spots||{})[p.id]||[]).map(x=>({...x,mine:true}));
  const all = base.concat(mine);
  const order = ['food','cafe','sweet','wear','sight'];
  const sorted = all.map((sp,i)=>({sp, i:i-base.length})).sort((a,b)=>order.indexOf(a.sp.k)-order.indexOf(b.sp.k));
  const show = full ? sorted : sorted.slice(0,5);
  return '<div class="spots"><div class="sp-h"><b>몰 안 갈 곳</b><span>'+(all.length?all.length+'곳':'아직 없음')+((MALL_SPOTS[p.id]||{}).src?' · '+MALL_SPOTS[p.id].src:'')+'</span></div>'
    + show.map(o=>spotRow(o.sp, p.id, o.i)).join('')
    + '<div class="sp-f">'+(!full && all.length>5?'<button onclick="openMall(\''+p.id+'\')">전체 '+all.length+'곳 보기</button>':'')
    + '<button onclick="openSpotAdd(\''+p.id+'\')">＋ 가게 추가</button></div></div>';
}

function won(y){
  const w = y*(+S.rate||190);
  if(w < 10000) return Math.round(w/1000)+'천원';
  return (Math.round(w/1000)/10).toString().replace(/\.0$/,'')+'만원';
}
function haversine(a,b){ const R=6371, r=x=>x*Math.PI/180, dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function priceText(p){
  if(!p.price) return '';
  const [a,b] = p.price;
  if(a===0 && b===0) return '<b>무료</b>';
  const c = CUR().sym, y = a===b ? c+a : c+a+'~'+b;
  const w = a===b ? '약 '+won(a) : '약 '+won(a)+'~'+won(b);
  return '<b>1인 '+y+'</b> <span>· '+w+' · 대략</span>';
}
function moveText(a,b){
  if(!a || !b) return '';
  const pa = place(a), pb = place(b);
  if(!pa || !pb) return '';
  if(!isGZ()){
    if(pa.lat==null || pb.lat==null) return '';
    const km = haversine(pa, pb), d = km < 1 ? Math.round(km*1000)+'m' : km.toFixed(1)+'km';
    if(km < 0.15) return '바로 옆 · 걸어서';
    return km < 1.3 ? '걸어서 약 '+Math.max(2, Math.round(km*13))+'분 · '+d : '택시 약 '+Math.round(km/22*60+5)+'분 · '+d;
  }
  // 공항 ↔ 체인: 체인은 숙소 근처 지점으로 본다
  if(pa.area==='airport' && pb.area==='any') return MOVES['airport|baiyun'];
  if(pb.area==='airport' && pa.area==='any') return MOVES['airport|baiyun'];
  if(pa.area==='any' || pb.area==='any') return '가까운 지점 · 고덕에서 거리 확인';
  if(pa.area==='etc' || pb.area==='etc') return '위치 확인 후 택시';
  if(pa.area===pb.area) return '같은 동네 · 걸어서';
  const k = [pa.area,pb.area].sort().join('|');
  return MOVES[k] || '택시';
}

let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1600); }
function copy(text){
  const done = () => toast('복사됨 · '+text);
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('복사 실패 · 길게 눌러 복사하세요'); }
    ta.remove();
  }
}

function pix(rows, pal, sc){
  const h = rows.length, w = rows[0].length; let r = '';
  rows.forEach((row,y)=>{ let x=0; while(x<w){ const c=row[x]; if(c==='.'){x++;continue;} let e=x; while(e<w&&row[e]===c) e++;
    r += '<rect x="'+x+'" y="'+y+'" width="'+(e-x)+'" height="1" fill="'+(pal&&pal[c]||'currentColor')+'"/>'; x=e; } });
  return '<svg class="px-i" width="'+w*sc+'" height="'+h*sc+'" viewBox="0 0 '+w+' '+h+'" shape-rendering="crispEdges" aria-hidden="true">'+r+'</svg>';
}

const PKEY = 'triplog_gz_photos';
let PH = {};
const PDB = { db:null,
  open(){ return new Promise((ok,no)=>{ try{ const r = indexedDB.open('triplog_gz',1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos');
    r.onsuccess = () => { this.db = r.result; ok(this.db); }; r.onerror = () => no(r.error); }catch(e){ no(e); } }); },
  tx(mode){ return this.db.transaction('photos', mode).objectStore('photos'); },
  put(id,v){ return new Promise((ok,no)=>{ const r=this.tx('readwrite').put(v,id); r.onsuccess=()=>ok(); r.onerror=()=>no(r.error); }); },
  del(id){ return new Promise((ok,no)=>{ const r=this.tx('readwrite').delete(id); r.onsuccess=()=>ok(); r.onerror=()=>no(r.error); }); },
  all(){ return new Promise((ok,no)=>{ const out={}, r=this.tx('readonly').openCursor();
    r.onsuccess=()=>{ const c=r.result; if(c){ out[c.key]=c.value; c.continue(); } else ok(out); }; r.onerror=()=>no(r.error); }); }
};
const pk = id => isGZ() ? id : TRIP.id+':'+id;
async function loadPhotos(){
  try{
    if(!PDB.db) await PDB.open();
    if(isGZ()){ // 예전에 localStorage에 넣었던 사진은 옮기고 지움
      let old = null; try{ old = JSON.parse(localStorage.getItem(PKEY)); }catch(e){}
      if(old){ for(const k in old) await PDB.put(k, old[k]); try{ localStorage.removeItem(PKEY); }catch(e){} }
    }
    const all = await PDB.all(), pre = TRIP.id+':';
    PH = {};
    Object.keys(all).forEach(k=>{ if(isGZ() ? !k.includes(':') : k.startsWith(pre)) PH[isGZ()?k:k.slice(pre.length)] = all[k]; });
    if(Object.keys(PH).length) renderAll();

}

function shrinkPhoto(file, id){
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const max = 480, r = Math.min(1, max/Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    const data = c.toDataURL('image/jpeg', .72);
    const done = () => { renderAll();
      if(!$('#sheet').classList.contains('on')) return;
      if(id.includes('#')) openMenuPhoto(id);
      else if(sheetPlace) openPlaceSheet(sheetPlace);
      else openPhoto(id); };

    PDB.put(pk(id), data).then(()=>{ PH[id] = data; toast('사진을 넣었어요'); done(); })
      .catch(()=>{ toast('저장 공간이 꽉 찼어요. 안 쓰는 사진을 지워 주세요'); });
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('이 사진은 열 수 없어요. JPG나 PNG로 다시 골라 주세요'); };

/* 끌어다 놓기: data-drop 가진 칸에 사진 파일을 놓으면 저장 */
(function(){
  const target = e => e.target && e.target.closest ? e.target.closest('[data-drop]') : null;
  let last = null;
  document.addEventListener('dragover', e=>{
    if(!e.dataTransfer || ![...(e.dataTransfer.types||[])].includes('Files')) return;
    e.preventDefault();   // 파일을 엉뚱한 곳에 놓아도 브라우저가 이동하지 않게
    const t = target(e);
    if(last && last!==t) last.classList.remove('dropon');
    if(t){ t.classList.add('dropon'); e.dataTransfer.dropEffect = 'copy'; } else e.dataTransfer.dropEffect = 'none';
    last = t;
  });
  document.addEventListener('dragleave', e=>{ const t = target(e); if(t && !t.contains(e.relatedTarget)) t.classList.remove('dropon'); });
  document.addEventListener('drop', e=>{
    if(!e.dataTransfer) return;
    const t = target(e); if(last) last.classList.remove('dropon'); last = null;
    if(![...(e.dataTransfer.types||[])].includes('Files')){ if(t){ e.preventDefault(); toast('사진 파일을 끌어다 놓아 주세요. 웹 이미지는 먼저 저장한 뒤 끌어 오세요'); } return; }
    e.preventDefault();
    if(!t || !TRIP){ toast('사진 칸(장소 그림·메뉴 사진 넣기) 위에 놓아 주세요'); return; }
    const f = [...e.dataTransfer.files].find(x=>/^image\//.test(x.type));
    if(!f){ toast('사진 파일만 넣을 수 있어요'); return; }
    shrinkPhoto(f, t.dataset.drop);
  });
})();

      const dx = arr[0].x-start.arr[0].x, dy = arr[0].y-start.arr[0].y;

    } else if(arr.length>=2 && start.d){

      const d = Math.hypot(arr[0].x-arr[1].x, arr[0].y-arr[1].y), f = start.d/d;
      const mx = ((start.arr[0].x+start.arr[1].x)/2 - r.left)/r.width, my = ((start.arr[0].y+start.arr[1].y)/2 - r.top)/r.height;
      const c = mapClampVB([0,0,v[2]*f,v[3]*f]);

    }
  });
  const end = e=>{
    if(!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);

    if(pts.size===0) start = null;

})();

/* ───────── 일정 끌어다 놓기 ─────────
   시간은 칸에 고정: 순서를 바꾸거나 넣고 빼도 시간 칸은 그대로, 장소만 칸을 옮겨 다님 */
function slotMove(k, to){
  const d = S.days[S.day], times = d.items.map(x=>x.time);
  const [x] = d.items.splice(k,1); d.items.splice(to,0,x);
  d.items.forEach((it,i)=>{ it.time = times[i]; });
  [to, to+1, k, k+1].forEach(i=>{ if(d.items[i]) d.items[i].move = ''; });
}
function addMin(t, m){ const r = /^(\d{1,2}):(\d{2})$/.exec(t||''); if(!r) return ''; let v = (+r[1])*60+(+r[2])+m; v = Math.min(v, 23*60+59);
  return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0'); }
function slotInsert(id, to){
  const d = S.days[S.day], times = d.items.map(x=>x.time);
  const last = times.length ? times[times.length-1] : '';
  d.items.splice(to, 0, {id:uid(), time:'', placeId:id, title:'', zh:'', memo:'', move:''});
  times.push(addMin(last, 60));
  d.items.forEach((it,i)=>{ it.time = times[i] || ''; });
  if(d.items[to+1]) d.items[to+1].move = '';
}
function slotRemove(k){
  const d = S.days[S.day], times = d.items.map(x=>x.time);
  d.items.splice(k,1);
  d.items.forEach((it,i)=>{ it.time = times[i]; });
  if(d.items[k]) d.items[k].move = '';
}
let DRAG = null, DRAG_AT = 0;
const dragJust = () => Date.now()-DRAG_AT < 300;
function dragStart(e, kind, val){
  if(e.button && e.button!==0) return;
  e.preventDefault(); e.stopPropagation();
  const src = kind==='item' ? e.currentTarget.closest('.it') : e.currentTarget;
  const r = src.getBoundingClientRect();
  DRAG = {kind, val, src, x0:e.clientX, y0:e.clientY, dx:e.clientX-r.left, dy:e.clientY-r.top, w:r.width, moved:false, ghost:null, line:null, to:null, out:false};
  document.addEventListener('pointermove', dragMove, {passive:false});
  document.addEventListener('pointerup', dragEnd); document.addEventListener('pointercancel', dragEnd);
}
function dragMove(e){
  if(!DRAG) return;
  if(!DRAG.moved){
    if(Math.hypot(e.clientX-DRAG.x0, e.clientY-DRAG.y0) < 6) return;
    DRAG.moved = true;
    const g = DRAG.src.cloneNode(true); g.className += ' ghost'; g.style.width = Math.min(DRAG.w, 420)+'px'; document.body.appendChild(g); DRAG.ghost = g;
    if(DRAG.kind==='item'){ DRAG.src.classList.add('dragging'); document.body.classList.add('dragging-item'); }
    DRAG.line = document.createElement('div'); DRAG.line.className = 'dropline';
  }
  e.preventDefault();
  DRAG.ghost.style.left = (e.clientX - Math.min(DRAG.dx, 60))+'px'; DRAG.ghost.style.top = (e.clientY - Math.min(DRAG.dy, 30))+'px';
  // 빼기 칸 (폰: 아래 띠 / 넓은 화면: 오른쪽 장소 판)
  const zone = $('#dropzone'), pal = $('#palette'), under = document.elementFromPoint(e.clientX, e.clientY);
  DRAG.out = DRAG.kind==='item' && !!under && (zone.contains(under) || (pal.offsetParent && pal.contains(under)));
  zone.classList.toggle('hot', DRAG.out); pal.classList.toggle('hot', DRAG.out);
  // 넣을 자리
  const tl = $('#dayView .tl') || $('#dayView'), cards = [...document.querySelectorAll('#dayView .it[data-k]')].filter(c=>c!==DRAG.src);
  const tr = tl.getBoundingClientRect();
  const inside = !DRAG.out && e.clientX > tr.left-40 && e.clientX < tr.right+40 && e.clientY > tr.top-60 && e.clientY < tr.bottom+60;
  if(inside){
    let to = cards.length, before = null;
    for(let i=0;i<cards.length;i++){ const b = cards[i].getBoundingClientRect(); if(e.clientY < b.top + b.height/2){ to = i; before = cards[i]; break; } }
    DRAG.to = to;
    if(before) before.parentNode.insertBefore(DRAG.line, before);
    else if(cards.length) cards[cards.length-1].after(DRAG.line);
    else tl.appendChild(DRAG.line);
  } else { DRAG.to = null; DRAG.line.remove(); }
  // 화면 끝에서 자동 스크롤
  if(e.clientY < 70) window.scrollBy(0,-14); else if(e.clientY > innerHeight-90) window.scrollBy(0,14);
}
function dragEnd(){
  document.removeEventListener('pointermove', dragMove); document.removeEventListener('pointerup', dragEnd); document.removeEventListener('pointercancel', dragEnd);
  if(!DRAG) return;
  const D = DRAG; DRAG = null;
  document.body.classList.remove('dragging-item'); $('#dropzone').classList.remove('hot'); $('#palette').classList.remove('hot');
  if(D.ghost) D.ghost.remove(); if(D.line) D.line.remove(); if(D.src) D.src.classList.remove('dragging');
  if(!D.moved){ if(D.kind==='place') addToDay(D.val, S.day, true); return; }
  DRAG_AT = Date.now();
  if(D.kind==='item'){
    if(D.out){ const nm = itemName(S.days[S.day].items[D.val]); slotRemove(D.val); save(); renderAll(); toast(nm+' · 일정에서 뺐어요'); return; }
    if(D.to==null) return;
    const k = D.val, to = D.to;   // to 는 끌던 카드를 뺀 목록 기준 자리
    if(to===k) return;
    slotMove(k, to); save(); renderAll();
  } else if(D.kind==='place' && D.to!=null){
    slotInsert(D.val, D.to); save(); renderAll(); toast(place(D.val).ko+' → '+(S.day+1)+'일차');
  }
}

function delDay(){

function saveFlight(k){
  S.flights[k] = {no:$('#fNo').value.trim(), date:$('#fDate').value, dep:$('#fDep').value, arr:$('#fArr').value};
  // 오는 편 날짜가 있으면 일수 맞추기 제안
  if(S.flights.out.date && S.flights.back.date){
    const n = Math.round((new Date(S.flights.back.date)-new Date(S.flights.out.date))/864e5)+1;
    if(n>0 && n<15 && n!==S.days.length){
      if(n>S.days.length){ while(S.days.length<n) S.days.push({id:uid(),items:[]}); toast(n+'일 일정으로 늘렸어요'); }
      else toast('항공 날짜는 '+n+'일인데 일정은 '+S.days.length+'일이에요');
    }
  }
  save(); closeSheet(); renderAll();
}

function openItem(k){
  const d = S.days[S.day];
  const x = k>=0 ? d.items[k] : {time:'',placeId:null,title:'',zh:'',memo:'',move:''};
  const p = x.placeId && place(x.placeId);
  const prv = k>=0 ? prevOf(S.day,k) : (d.items.length ? d.items[d.items.length-1].placeId : (topFixed(S.day)?'hotel':null));
  const auto = prv ? moveText(prv, x.placeId) : '';
  let h = '';
  if(p) h += '<div class="card" style="margin-bottom:12px"><div style="font-weight:700">'+esc(p.ko)+'</div><div class="zh" style="color:var(--t2);font-size:14px">'+esc(p.zh)+'</div>'+pyLine(p.zh,p)+links(p)
    + '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn sm" style="background:var(--bg)" onclick="copy(\''+jsq(p.gaode||p.zh)+'\')">고덕 검색어 복사</button>'
    + '<button class="btn sm" style="background:var(--bg)" onclick="closeSheet();showPlace(\''+p.id+'\')">장소 정보</button></div></div>';
  h += '<div class="fld"><label>시간</label><input id="iTime" type="time" value="'+esc(x.time)+'"></div>';
  h += '<div class="fld"><label>이름'+(p?' (비우면 장소 이름)':'')+'</label><input id="iTitle" value="'+esc(x.title)+'" placeholder="'+(p?esc(p.ko):'예: 호텔 휴식')+'"></div>';
  if(!p) h += '<div class="fld"><label>중국어 (고덕 검색용, 선택)</label><input id="iZh" class="zh" value="'+esc(x.zh)+'"></div>';
  h += '<div class="fld"><label>메모</label><textarea id="iMemo">'+esc(x.memo)+'</textarea></div>';
  if(prv) h += '<div class="fld"><label>앞 장소에서 이동</label><input id="iMove" value="'+esc(x.move)+'" placeholder="'+esc(auto||'예: 택시 15분')+'"><div class="hint">비우면 자동 안내'+(auto?' ('+esc(auto)+')':'')+'</div></div>';
  h += '<div class="btns" style="margin:4px 0 0"><button class="btn ac" onclick="saveItem('+k+')">저장</button></div>';
  if(k>=0){
    h += '<div class="btns" style="margin:10px 0 0">'
      + '<button class="btn" '+(k===0?'disabled style="opacity:.35"':'')+' onclick="moveItem('+k+',-1)">위로</button>'
      + '<button class="btn" '+(k===d.items.length-1?'disabled style="opacity:.35"':'')+' onclick="moveItem('+k+',1)">아래로</button></div>';
    if(S.days.length>1) h += '<div class="fld" style="margin-top:14px"><label>다른 날로 옮기기</label><div class="daypick">'
      + S.days.map((_,j)=>j===S.day?'':'<button onclick="toDay('+k+','+j+')">'+(j+1)+'일차</button>').join('')+'</div></div>';
    h += '<div class="btns" style="margin:14px 0 0"><button class="btn danger" onclick="delItem('+k+')">이 일정 삭제</button></div>';
  }
  openSheet(k>=0?'일정 수정':'직접 추가', h);
}
function saveItem(k){
  const d = S.days[S.day];
  const x = k>=0 ? d.items[k] : {id:uid(),placeId:null};
  x.time = $('#iTime').value;
  x.title = $('#iTitle').value.trim();
  if($('#iZh')) x.zh = $('#iZh').value.trim();
  x.memo = $('#iMemo').value.trim();
  x.move = $('#iMove') ? $('#iMove').value.trim() : (x.move||'');
  if(k<0){
    if(!x.title){ toast('이름을 적어 주세요'); return; }
    d.items.push(x);
  }
  save(); closeSheet(); renderAll();
}
function moveItem(k,dir){
  const a = S.days[S.day].items, j = k+dir;
  if(j<0||j>=a.length) return;
  const tk = a[k].time, tj = a[j].time;
  [a[k],a[j]]=[a[j],a[k]]; a[k].time = tk; a[j].time = tj; a[k].move = ''; a[j].move = '';
  save(); renderDays(); openItem(j);
}
function toDay(k,j){
  const x = S.days[S.day].items.splice(k,1)[0];
  x.move = '';
  S.days[j].items.push(x); save(); closeSheet(); renderAll(); toast((j+1)+'일차로 옮겼어요');
}
function delItem(k){
  const x = S.days[S.day].items[k];
  ask('「'+itemName(x)+'」 일정을 지울까요?', '지우기', () => { S.days[S.day].items.splice(k,1); save(); renderAll(); });
}

let cat='all', area='all', tier='all';
function placeCard(p){
  const u = usedIn(p.id);
  const badges = [];
  if(p.mich) badges.push('<span class="bd mich">미슐랭 '+p.mich+'</span>');
  (p.tags||[]).forEach(t=>badges.push('<span class="bd ac">'+(t==='영상'?'유튜브 영상':t)+'</span>'));
  if(p.tier) badges.push('<span class="bd tier t-'+(p.tier==='럭셔리'?'lux':p.tier==='중고가'?'mid':'low')+'">'+p.tier+'</span>');
  badges.push('<span class="bd cat" style="--c:'+CAT_C[p.cat]+(p.cat==='base'?';color:#FFF6B8':'')+'">'+CATS[p.cat]+'</span>');
  if(isGZ()) badges.push('<span class="bd">'+AREAS[p.area].short+'</span>');
  if(p.closed) badges.push('<span class="bd warn">'+p.closed.map(d=>DOW[d]).join('·')+'요일 휴무 많음</span>');
  if(u.length) badges.push('<span class="bd ac">'+u.join('·')+'일차에 넣음</span>');
  if((p.menu||[]).some(m=>(m[3]||'').includes('s'))) badges.push('<span class="bd shrimp">새우 메뉴</span>');
  if(S.visited[p.id]) badges.unshift('<span class="bd been">가본 곳</span>');
  const pr = priceText(p);
  const fav = S.fav[p.id];
  return '<div class="pc" id="pc-'+p.id+'"><div class="h"><div style="min-width:0;flex:1"><div class="nmrow"><span class="nm">'+esc(p.ko)+'</span>'
    + '<button class="star'+(fav?' on':'')+'" onclick="toggleFav(\''+p.id+'\')" aria-label="찜">'+ICON_STAR(fav)+'</button></div>'
    + '<div class="zhn zh">'+esc(p.zh)+'</div>'+pyLine(p.zh,p)+(p.en?'<div class="enn">'+esc(p.en)+'</div>':'')+'</div>'
    + '<button class="thbtn" data-drop="'+p.id+'" onclick="openPhoto(\''+p.id+'\')" aria-label="'+esc(p.ko)+' 사진 보기">'+thumb(p,104)+'</button></div>'
    + '<div class="badges">'+badges.join('')+'</div>'
    + (pr?'<div class="price">'+pr+'</div>':'')
    + branchLine(p)
    + (p.note?'<div class="note">'+gl(p.note)+'</div>':'')
    + (p.menu&&p.menu.length?'<div class="menu">'+sortMenu(p.menu).map(m=>'<div class="mrow">'+menuPh(p.id,m[0])+'<div class="mtext" onclick="copy(\''+jsq(m[0])+'\')"><div class="zh">'+esc(m[0])+(m[5]?' <span class="mp">¥'+m[5]+'</span>':'')+'</div>'
      +pyLine(m[0],m[2]?{py:m[2]}:null)+(m[4]?'<div class="men">'+esc(m[4])+'</div>':'')+(m[1]?'<div class="ko">'+esc(m[1])+'</div>':'')+menuTags(m[3])+'</div><button class="cp" onclick="copy(\''+jsq(m[0])+'\')">복사</button></div>').join('')+'</div>':'')
    + noteBox(p)
    + mallSpots(p)
    + links(p)
    + '<div class="acts"><button onclick="copy(\''+jsq(p.gaode||p.zh)+'\')">'+(isGZ()?'고덕 검색어 복사':'현지 이름 복사')+'</button><button class="ac" onclick="openAddTo(\''+p.id+'\')">일정에 넣기</button>'
    + '<button class="'+(S.visited[p.id]?'beenon':'')+'" onclick="toggleVisited(\''+p.id+'\')">'+(S.visited[p.id]?'가본 곳 취소':'가본 곳 표시')+'</button>'
    + (p.custom?'<button onclick="openPlaceEdit(\''+p.id+'\')">수정</button>':'')+'</div></div>';
}
function menuTags(f){
  if(!f) return '';
  const T = {s:['새우','mt-s'],k:['입맛 추천','mt-k'],r:['셰프 추천','mt-r'],x:['호불호','mt-x'],c:['있으면','mt-c']};
  return '<div class="mtags">'+[...f].filter(c=>T[c]).map(c=>'<span class="'+T[c][1]+'">'+T[c][0]+'</span>').join('')+'</div>';
}
function sortMenu(menu){
  const sc = m => { const f = m[3]||''; return (f.includes('s')?0:2) + (f.includes('k')?0:1) + (f.includes('x')?5:0) + (f.includes('c')?.5:0); };
  return menu.map((m,i)=>[m,i]).sort((a,b)=>sc(a[0])-sc(b[0]) || a[1]-b[1]).map(x=>x[0]);
}
/* 중국어 지명 옆에 한국어 읽기 붙이기 (화면 표시용, 복사는 원문) */

  '白天鹅宾馆':'화이트스완 호텔','第十甫路':'디스푸루','花城广场':'화청광장','东山口':'둥산커우','首府大厦':'서우푸 빌딩','广州文华东方酒店':'만다린 오리엔탈 호텔',

const GLOSS_RE = new RegExp(Object.keys(GLOSS).sort((a,b)=>b.length-a.length).join('|'),'g');
function gl(t){ return esc(t).replace(GLOSS_RE, m => m+'<span class="gl">('+GLOSS[m]+')</span>'); }
function branchLine(p){
  const a = p.addr || p.baddr || '';
  if(!p.br && !a && !p.loc) return '';
  const zhAddr = /[\u4e00-\u9fff]/.test(a) && !/고덕|확인|일대|근처|현지|쪽/.test(a);
  return '<div class="branch"><span class="bl">위치</span><div style="min-width:0">'+(p.loc?'<div class="bloc">'+gl(p.loc)+'</div>':'')+(p.br?'<div class="bn zh">'+gl(p.br)+'</div>':'')
    + (a?'<div class="ba zh">'+gl(a)+'</div>':'')+'</div>'
    + (zhAddr?'<button class="cp" onclick="copy(\''+jsq(a.replace(/ \(.*\)$/,''))+'\')">주소 복사</button>':'')+'</div>';
}
function jsq(s){ return esc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }

  $('#tierChips').innerHTML = cat==='mall' ? ['all','럭셔리','중고가','중저가'].map(t=>'<button class="chip'+(tier===t?' on':'')+'" onclick="tier=\''+t+'\';renderPlaces()">'+(t==='all'?'모든 등급':t)+'</button>').join('') : '';
  const q = $('#q').value.trim().toLowerCase();

function tripState(t){ let x = null; try{ x = JSON.parse(localStorage.getItem(keyOf(t))) }catch(e){} return x; }
function tripCard(t){
  const x = tripState(t) || (t.pack==='gz' ? seed() : null);
  const n = x ? x.days.length : (t.nDays||0), st = x && x.flights.out.date ? new Date(x.flights.out.date+'T00:00:00') : null;
  let dd = '';
  if(st && !isNaN(st)){ const today = new Date(); today.setHours(0,0,0,0); const diff = Math.round((st-today)/864e5);
    dd = t.done ? '다녀옴' : diff>0 ? 'D-'+diff : diff===0 ? '오늘 출발' : (diff > -n ? '여행 중' : '다녀옴?'); }
  else dd = t.done ? '다녀옴' : '날짜 미정';
  const cnt = o => o ? Object.keys(o).length : 0;
  const places = x ? ((t.pack==='gz' ? GZ_P.filter(p=>!p.hidden && p.cat!=='base').length : 0) + (x.custom||[]).length) : 0;
  return '<div class="tc-wrap"><button class="tcard'+(t.done?' done':'')+'" onclick="openTrip(\''+t.id+'\')">'
    + '<div class="tc-top"><div style="min-width:0"><div class="tc-en">'+esc((t.en||'MY').toUpperCase())+'</div><div class="tc-name">'+esc(t.name)+'</div>'
    + '<div class="tc-sub">'+(n?(n>1?(n-1)+'박 ':'')+n+'일':'')+(t.people?' · '+t.people+'명':'')+(st&&!isNaN(st)?' · '+(st.getMonth()+1)+'월 '+st.getDate()+'일 출발':'')+'</div></div>'
    + '<span class="tc-dd">'+dd+'</span></div>'
    + '<div class="tc-stats"><span>장소 '+places+'</span><span>찜 '+cnt(x&&x.fav)+'</span><span>가본 곳 '+cnt(x&&x.visited)+'</span><span>메모 '+cnt(x&&x.notes)+'</span></div>'
    + '</button><button class="tc-more" onclick="openTripMenu(\''+t.id+'\')" aria-label="'+esc(t.name)+' 메뉴">···</button></div>';
}
function renderHome(){
  const up = TRIPS.filter(t=>!t.done), done = TRIPS.filter(t=>t.done);
  $('#homeView').innerHTML =
    '<div class="sec">다가오는 여행</div><div class="pad tlist">'+(up.map(tripCard).join('') || '<div class="empty-day">다가오는 여행이 없어요</div>')+'</div>'
    + '<div class="btns"><button class="btn ac" onclick="openNewTrip()">＋ 새 여행 만들기</button></div>'
    + (done.length ? '<div class="sec">다녀온 여행</div><div class="pad tlist">'+done.map(tripCard).join('')+'</div>' : '')
    + '<p class="cnt" style="padding:18px 20px 0">새 도시의 맛집·몰·메뉴는 클로드에게 「OO 여행 장소 채워줘」라고 부탁하면 광저우처럼 넣어 드려요.</p>';
}
function openTrip(id){
  TRIP = TRIPS.find(t=>t.id===id); if(!TRIP) return;
  KEY = keyOf(TRIP); loadS();
  P = isGZ() ? GZ_P : [hotelPlace()];
  document.body.classList.add('in-trip'); document.body.classList.toggle('gz', isGZ());
  mapDay = -1; mapCat = 'all'; mapZoom = 'all'; mapCustom = null; cat = 'all'; area = 'all'; tier = 'all'; PH = {};
  $('#q').value = '';
  if(LMAP){ LMAP.remove(); LMAP = null; LLAYER = null; }
  renderAll(); go('plan'); loadPhotos();
}
function goHome(){
  TRIP = null; S = null; closeSheet();
  if(LMAP){ LMAP.remove(); LMAP = null; LLAYER = null; }
  document.body.classList.remove('in-trip','gz');
  document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on', e.id==='pg-home'));
  renderTop(); renderHome(); window.scrollTo(0,0);
}
function tripForm(t){
  t = t || {};
  return '<div class="fld"><label>여행 이름</label><input id="tName" value="'+esc(t.name||'')+'" placeholder="예: 오사카 먹방"></div>'
    + '<div class="two"><div class="fld"><label>도시 (한국어)</label><input id="tCity" value="'+esc(t.city||'')+'" placeholder="예: 오사카"></div>'
    + '<div class="fld"><label>도시 (영어, 지도 찾기용)</label><input id="tEn" value="'+esc(t.en||'')+'" placeholder="예: Osaka"></div></div>'
    + '<div class="fld"><label>인원</label><input id="tPeople" inputmode="numeric" value="'+esc(t.people||'')+'" placeholder="예: 4"></div>';
}
function openNewTrip(){
  openSheet('새 여행 만들기', tripForm()
    + '<div class="two"><div class="fld"><label>출발일 (선택)</label><input id="tStart" type="date"></div>'
    + '<div class="fld"><label>며칠</label><select id="tDays">'+Array.from({length:14},(_,i)=>'<option value="'+(i+1)+'"'+(i===3?' selected':'')+'>'+(i?i+'박 ':'')+(i+1)+'일</option>').join('')+'</select></div></div>'
    + '<div class="two"><div class="fld"><label>숙소 (선택)</label><input id="tHotel" placeholder="호텔 이름"></div>'
    + '<div class="fld"><label>통화</label><select id="tCur">'+CURS.map(c=>'<option value="'+c[0]+'">'+c[2]+' '+c[1]+'</option>').join('')+'</select></div></div>'
    + '<div class="btns" style="margin:4px 0 0"><button class="btn ac" onclick="createTrip()">만들기</button></div>');
}
function createTrip(){
  const name = $('#tName').value.trim() || $('#tCity').value.trim();
  if(!name){ toast('여행 이름이나 도시를 적어 주세요'); return; }
  const cur = $('#tCur').value, t = {id:'t'+uid(), pack:null, name, city:$('#tCity').value.trim()||name, en:$('#tEn').value.trim(),
    people:+$('#tPeople').value||'', done:false, created:Date.now()};
  const st = blankSeed({start:$('#tStart').value, days:$('#tDays').value, hotel:$('#tHotel').value.trim(), cur, rate:(CURS.find(c=>c[0]===cur)||[])[3]});
  try{ localStorage.setItem(keyOf(t), JSON.stringify(st)); }catch(e){ toast('저장 공간이 부족해요'); return; }
  TRIPS.push(t); saveTrips(); closeSheet(); openTrip(t.id); toast(name+' 여행을 만들었어요');
}
function openTripMenu(id){
  const t = TRIPS.find(x=>x.id===id);
  openSheet(t.name, tripForm(t)
    + '<div class="btns" style="margin:4px 0 0"><button class="btn ac" onclick="saveTripInfo(\''+id+'\')">저장</button></div>'
    + '<div class="btns" style="margin:12px 0 0"><button class="btn" onclick="toggleDone(\''+id+'\')">'+(t.done?'다가오는 여행으로 옮기기':'다녀온 여행으로 옮기기')+'</button></div>'
    + (t.pack==='gz' ? '' : '<div class="btns" style="margin:12px 0 0"><button class="btn danger" onclick="delTrip(\''+id+'\')">이 여행 삭제</button></div>'));
}
function saveTripInfo(id){
  const t = TRIPS.find(x=>x.id===id);
  t.name = $('#tName').value.trim() || t.name; t.city = $('#tCity').value.trim() || t.city; t.en = $('#tEn').value.trim(); t.people = +$('#tPeople').value || '';
  delete t.center; saveTrips(); closeSheet(); renderAll(); toast('저장했어요');
}
function toggleDone(id){ const t = TRIPS.find(x=>x.id===id); t.done = !t.done; saveTrips(); closeSheet(); renderAll(); toast(t.done?'다녀온 여행으로 옮겼어요':'다가오는 여행으로 옮겼어요'); }
function delTrip(id){
  const t = TRIPS.find(x=>x.id===id);
  ask('「'+t.name+'」 여행의 일정·장소·메모·사진이 모두 지워져요.', '삭제', async () => {
    try{ localStorage.removeItem(keyOf(t)); }catch(e){}
    try{ if(!PDB.db) await PDB.open(); const all = await PDB.all(); for(const k of Object.keys(all)) if(k.startsWith(t.id+':')) await PDB.del(k); }catch(e){}
    TRIPS = TRIPS.filter(x=>x.id!==id); saveTrips(); renderAll(); toast('삭제했어요');
  });
}
/* 새 여행 숙소 */
function openHotelEdit(){
  const h = S.hotel || {};
  openSheet('숙소', '<div class="fld"><label>숙소 이름</label><input id="eKo" value="'+esc(h.ko||'')+'"></div>'
    + '<div class="fld"><label>현지 이름 (택시 기사님께 보여 줄 글자, 선택)</label><input id="eZh" class="zh" value="'+esc(h.zh||'')+'"></div>'
    + '<div class="fld"><label>주소 (선택)</label><input id="eAddr" value="'+esc(h.addr||'')+'"></div>'
    + '<div class="fld"><label>메모 (가까운 역 등)</label><input id="eNote" value="'+esc(h.note||'')+'"></div>'
    + geoBox(h)
    + '<div class="btns" style="margin:4px 0 0"><button class="btn ac" onclick="saveHotel()">저장</button></div>');
}
function saveHotel(){
  S.hotel = {ko:$('#eKo').value.trim(), zh:$('#eZh').value.trim(), addr:$('#eAddr').value.trim(), note:$('#eNote').value.trim(),
    lat: $('#eLat').value!==''?+$('#eLat').value:undefined, lng: $('#eLng').value!==''?+$('#eLng').value:undefined};
  save(); closeSheet(); renderAll(); toast('숙소를 저장했어요');
}
/* 위치 찾기 (오픈스트리트맵 검색) */
const IN_ARTIFACT = /claude/.test(location.hostname);
function geoBox(p){
  const has = p.lat!=null;
  return '<div class="fld"><label>지도 위치</label><div class="geo"><span id="geoTxt">'+(has?'위치 있음 · '+(+p.lat).toFixed(4)+', '+(+p.lng).toFixed(4):'아직 없음')+'</span>'
    + '<button onclick="geoFind()">이름으로 위치 찾기</button>'+(has?'<button onclick="geoClear()">지우기</button>':'')+'</div>'
    + '<input type="hidden" id="eLat" value="'+(has?p.lat:'')+'"><input type="hidden" id="eLng" value="'+(has?p.lng:'')+'"><div id="geoRes"></div>'
    + '<div class="hint">찾은 결과 중 맞는 곳을 누르면 지도에 핀이 꽂혀요</div></div>';
}
let GEO_RES = [];
async function geoFind(){
  if(IN_ARTIFACT){ toast('위치 찾기는 배포 주소(github.io)에서만 돼요'); return; }
  const name = ($('#eZh') && $('#eZh').value.trim()) || ($('#eEn') && $('#eEn').value.trim()) || ($('#eAddr') && $('#eAddr').value.trim()) || $('#eKo').value.trim();
  if(!name){ toast('이름을 먼저 적어 주세요'); return; }
  const q = name+' '+(TRIP.en || TRIP.city || '');
  $('#geoRes').innerHTML = '<div class="hint">찾는 중…</div>';
  try{
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=ko,en&q='+encodeURIComponent(q));
    GEO_RES = await r.json();
    $('#geoRes').innerHTML = GEO_RES.length ? '<div class="pick">'+GEO_RES.map((g,i)=>'<button onclick="geoPick('+i+')"><div style="font-size:13px">'+esc(g.display_name.split(',').slice(0,3).join(','))+'</div></button>').join('')+'</div>'
      : '<div class="hint">못 찾았어요. 현지 이름이나 영어 이름, 주소로 다시 해 보세요</div>';
  }catch(e){ $('#geoRes').innerHTML = '<div class="hint">인터넷 연결을 확인해 주세요</div>'; }
}
function geoPick(i){ const g = GEO_RES[i]; $('#eLat').value = (+g.lat).toFixed(6); $('#eLng').value = (+g.lon).toFixed(6);
  $('#geoTxt').textContent = '위치 있음 · '+(+g.lat).toFixed(4)+', '+(+g.lon).toFixed(4); $('#geoRes').innerHTML = ''; toast('위치를 넣었어요 · 저장을 눌러 주세요'); }
function geoClear(){ $('#eLat').value=''; $('#eLng').value=''; $('#geoTxt').textContent='아직 없음'; }
/* 새 여행 지도: 실제 지도 (Leaflet + 오픈스트리트맵, 색을 빼서 연하게) */
let LMAP = null, LLAYER = null;
function loadLeaflet(){
  return new Promise((ok,no)=>{
    if(window.L) return ok();
    const c = document.createElement('link'); c.rel = 'stylesheet'; c.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(c);
    const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; sc.onload = ()=>ok(); sc.onerror = no; document.head.appendChild(sc);
  });
}
const geoOf = p => p && p.lat!=null ? [+p.lat, +p.lng] : null;
function lpin(label, fill, tc){ return L.divIcon({className:'lpin', iconSize:[0,0], html:'<div class="lp" style="background:'+fill+';color:'+(tc||'#0B0A05')+'">'+esc(label)+'</div>'}); }
function renderRealMap(){
  const wrap = $('#mapWrap');
  const dayChip = (v,t) => '<button class="chip'+(mapDay===v?' on':'')+'" onclick="setMapDay('+v+')">'+t+'</button>';
  $('#mapDays').innerHTML = dayChip(-1,'장소 보기') + S.days.map((_,i)=>dayChip(i,(i+1)+'일차 동선')).join('');
  $('#mapCats').innerHTML = mapDay<0 ? ['all','fav','been',...Object.keys(CATS).filter(c=>c!=='base' && allPlaces().some(p=>p.cat===c))].map(c=>
    '<button class="chip'+(mapCat===c?' on':'')+'" onclick="mapCat=\''+c+'\';renderMap()">'+(c==='all'?'전체':c==='fav'?'찜':c==='been'?'가본 곳':CATS[c])+'</button>').join('') : '';
  $('#mapCats').className = 'chips sub'; $('#mapZooms').innerHTML = '';
  $('#mapLegend').innerHTML = Object.keys(CATS).filter(c=>c!=='base' && allPlaces().some(p=>p.cat===c)).map(c=>'<span><i style="background:'+CAT_C[c]+'"></i>'+CAT_CH[c]+' '+CATS[c]+'</span>').join('');
  const noGeo = allPlaces().filter(p=>p.cat!=='base' && p.lat==null);
  $('#mapBelow').innerHTML = (noGeo.length ? '<div class="sec">위치가 없는 곳 (눌러서 「이름으로 위치 찾기」)</div><div class="offmap">'+noGeo.map(p=>'<button class="chip" onclick="openPlaceEdit(\''+p.id+'\')">'+esc(p.ko)+'</button>').join('')+'</div>' : '')
    + '<p class="cnt" style="padding-top:10px">지도 © OpenStreetMap 기여자</p>';
  if(IN_ARTIFACT){ wrap.innerHTML = '<div class="empty-day" style="border:0;box-shadow:none">실제 지도는 배포 주소(github.io)에서 보여요</div>'; return; }
  if(!$('#lmap')){ if(LMAP){ LMAP.remove(); LMAP = null; LLAYER = null; } wrap.innerHTML = '<div id="lmap"></div>'; }
  loadLeaflet().then(async ()=>{
    if(!LMAP){
      LMAP = L.map('lmap', {zoomControl:true});
      LMAP.attributionControl.setPrefix(false);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(LMAP);
    }
    if(LLAYER) LLAYER.remove();
    LLAYER = L.layerGroup().addTo(LMAP);
    const pts = [], h = place('hotel');
    if(geoOf(h)){ L.marker(geoOf(h), {icon:lpin('숙소','#0B0A05','#FFF6B8')}).on('click',()=>openPlaceSheet('hotel')).addTo(LLAYER); }
    if(mapDay>=0){
      const line = [];
      if(topFixed(mapDay) && geoOf(h)) line.push(geoOf(h));
      S.days[mapDay].items.forEach((x,k)=>{ const p = x.placeId && place(x.placeId), g = geoOf(p); if(!g) return;
        line.push(g); pts.push(g); L.marker(g, {icon:lpin(String(k+1),'#A5E6BA')}).on('click',()=>openPlaceSheet(p.id)).addTo(LLAYER); });
      if(botFixed(mapDay)==='hotel' && geoOf(h)) line.push(geoOf(h));
      if(line.length>1) L.polyline(line, {color:'#0B0A05', weight:3, dashArray:'6 6'}).addTo(LLAYER);
    } else {
      allPlaces().forEach(p=>{
        if(p.cat==='base' || !geoOf(p)) return;
        if(mapCat==='fav' ? !S.fav[p.id] : mapCat==='been' ? !S.visited[p.id] : (mapCat!=='all' && p.cat!==mapCat)) return;
        pts.push(geoOf(p));
        L.marker(geoOf(p), {icon:lpin(S.visited[p.id]?'가봄':(CAT_CH[p.cat]||'·'), S.visited[p.id]?'#FFFCF7':(CAT_C[p.cat]||'#FFF6B8'))})
          .bindTooltip(p.ko, {direction:'bottom', permanent:true, className:'ltip', offset:[0,4]}).on('click',()=>openPlaceSheet(p.id)).addTo(LLAYER);
      });
    }
    if(geoOf(h) && mapDay<0) pts.push(geoOf(h));
    if(pts.length>1) LMAP.fitBounds(pts, {padding:[36,36], maxZoom:16});
    else if(pts.length===1) LMAP.setView(pts[0], 15);
    else {
      if(!TRIP.center){ try{ const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(TRIP.en||TRIP.city)); const j = await r.json(); if(j[0]){ TRIP.center = [+j[0].lat, +j[0].lon]; saveTrips(); } }catch(e){} }
      LMAP.setView(TRIP.center || [35.68, 139.76], TRIP.center ? 12 : 3);
    }
    setTimeout(()=>LMAP && LMAP.invalidateSize(), 60);
  }).catch(()=>{ wrap.innerHTML = '<div class="empty-day" style="border:0;box-shadow:none">지도를 불러오지 못했어요. 인터넷 연결을 확인해 주세요</div>'; });
}

const GZ_P = P;
loadTrips();
goHome();
</script>
